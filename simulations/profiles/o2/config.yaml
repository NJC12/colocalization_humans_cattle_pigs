# Snakemake SLURM profile for O2.
#
# Usage:
#   snakemake --configfile config/cattle_sel_bottlenecked.yaml \
#             --profile profiles/o2 -j 200
#
# Per-rule resources are declared inside the rule files (slurm_partition,
# runtime, mem_mb, cpus_per_task). This profile only sets the executor and
# the dispatch-time defaults.

executor: slurm
jobs: 200
latency-wait: 60
restart-times: 2

# Defaults apply to rules with no `resources:` block of their own -- currently
# stage4_annot_vcf and stage3_done. Measured over 18 round-3 stage4_annot_vcf
# jobs: max 0:41 elapsed, 110 MB RSS. The old runtime=240/mem_mb=8000 were ~350x
# and ~73x the observed peaks; a smaller ask is far more backfill-eligible,
# which matters because these jobs spent longer queued than running.
default-resources:
  - slurm_partition=short
  - runtime=30
  - mem_mb=4000
  - cpus_per_task=2

# Reasonable defaults for cluster behavior on O2:
keep-going: True
rerun-incomplete: True
# use-conda intentionally disabled: every binary the rules need (python, slim,
# dap-g, plink2, fastenloc, tabix, bgzip, dap2enloc) is referenced by absolute
# path in the rules/Snakefile, so per-rule conda env creation is wasted work
# (and consumed 2+ GB resolving deps, OOM-killing the controller previously).
# The rules' `conda:` directives are kept as informational metadata.
use-conda: False
printshellcmds: True
