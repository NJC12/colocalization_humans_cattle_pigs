# Cattle baseline simulation (no agricultural-selection multiplier; just the
# 3-stage SLiM chain that produces farm_selection.*.full.ts).

pipeline: cattle_baseline
species: cattle
basename: cattle_baseline
species_prefix: c

# ---- Selection / demography parameters ----
Q_scaling: 0.01
# Round-2 value: what the three farm_*.slim scripts hard-coded. NOTE that the
# msprime stage (farm_create_orig_pop_e2.py) ran at 1.3e-8 in these runs, so the
# deep genealogy and the forward phase disagreed -- that inconsistency is the
# reason this key exists. Round-3 configs use 1.3e-8 everywhere.
recombination_rate: 9.26e-9
L: 10000000

# ---- Sample sizes ----
gwas_scaling: 35
gtex_scaling: 35
min_maf: 0.01
gwas_size: 8000
gtex_size: 1000

# ---- Per-stage seeds ----
stage1_seed: 20250303
stage2_seed: 20250303
stage3_seed: 1
stage4_seed: 1
stage5_seed: 1

# ---- Trait selection cap (optional) ----
# Set all three to enable a category-wide cap on fine-mapped traits.
# Each replicate independently selects ceil(selection_cap / num_replicates)
# traits, seeded by (selection_seed, stage1_seed). Raising selection_cap on
# a later run extends the prefix without reshuffling, so already-completed
# DAP-G/fastEnloc jobs remain valid.
# selection_cap: 1500
# selection_seed: 42
# num_replicates: 4

# ---- Search dirs ----
# Round-2 (new DFE) starts from scratch; legacy dirs intentionally omitted to
# avoid silently reusing old-DFE .ts files.
cattle_baseline_search_dirs: []
stage1_search_dirs: []
stage2_search_dirs: []

# ---- Burn-in cycle to use as input to farm_selection.slim ----
burn_in_cycle: 25000

# ---- SLiM binary ----
# Override the rule-level default (/home/njc12/bin/slim/build/slim, SLiM 4.2.2)
# because pyslim 1.1.1 in coloc_sims env writes file_version 0.9 (SLiM 5.x
# multi-chromosome format) which SLiM 4.x cannot read. The wrapper sets
# LD_LIBRARY_PATH to GCC 14.2's libstdc++ (needed because the binary was
# built with that compiler).
slim_binary: /home/njc12/bin/slim_5/slim_wrapper.sh

# ---- Stage 3/4 specifics ----
ld_ctrl: 0.75
dapg_window: 250000
fastenloc_total_snps: auto    # "auto" = intersection of gwas+gtex annotation VCF SNP IDs; or set an int
already_includes_neutral: True

# ---- Workdir / publish ----
workdir: /n/scratch/users/n/njc12/snakemake/simulations_round_2/cattle_baseline
publishdir: /n/data2/hms/dbmi/sunyaev/lab/nconnally/snakemake/simulations_round_2/cattle_baseline
