# Human simulation, 2 Mb region -- x1 PHENOTYPE-SCALING VARIANT of category A.
#
# Identical to human_2Mb.yaml EXCEPT the phenotype scaling multipliers are 1
# instead of 35 (gwas_scaling / gtex_scaling below). The trait effect size is
#   beta = sqrt(|selection_coeff|) * scaling
# (create_gwas_files_and_phenotypes.py), so this rescales every phenotype by
# 1/35 relative to the x35 run while leaving the genetics untouched.
#
# Stage 1 (the genetic simulation) is NOT rerun: each replicate reuses the
# existing x35 tree sequence via stage1_search_dirs, which is passed PER
# REPLICATE on the command line by submit_2Mb_x1.sh (it must point at that
# replicate's own A{N}/stage1 dir only -- the search-dir lookup is seed-strict
# and aborts if a mismatched-seed hts_*.ts is visible). Only stages 2-5 (trait
# creation, DAP-G fine-mapping, fastEnloc colocalization, plink GLM) rerun.
#
# Per-replicate config: submit 10x, overriding stage1_seed, stage2_seed,
# stage1_search_dirs, workdir, publishdir on the command line (A{N} -> seed
# 1{N}: A1=11 ... A10=20). Outputs land under a separate ..._2Mb_x1 root so the
# x35 and x1 results sit side by side and never collide.

pipeline: human
species: human
basename: human
species_prefix: h

# ---- Demography parameters ----
Q_scaling: 10
# Round-2 value: the flat map stdpopsim's get_contig(length=L) returned for
# HomSap when no rate was passed. The cattle arm ran at 9.26e-9, so the two arms
# differed in recombination as well as demography. Round-3 configs use 1.3e-8.
recombination_rate: 1.282e-8
L: 2000000
dapg_window: 250000
gwas_h2: 0.01
gtex_h2: 0.4

# ---- Sample sizes ----
gwas_scaling: 1       # x1 variant (x35 run uses 35)
gtex_scaling: 1       # x1 variant (x35 run uses 35)
min_maf: 0.01
# Pinned, not defaulted. causal_min_maf now defaults to 0 (no floor) and applies
# in both causal_sampling schemes; 0.01 is what this config's arm actually ran
# under, and it is also the one value that emits no path segment, so existing
# stage-2..5 outputs stay adoptable. See helpers/paths.py:LEGACY_CAUSAL_MIN_MAF.
causal_min_maf: 0.01
gwas_size: 8000
gtex_size: -1          # fan out GTEx to 1000 + 500 (250 written but not analyzed)
neutral_trait_vars: False   # category A; B overrides this to True via --config

# ---- Trait loci ----
# 50 GWAS traits (central causal loci) = the 50 shared GTEx traits; plus 50
# GTEx-only loci drawn from the 500 kb edge flanks -> 100 GTEx traits total.
n_central_traits: 50
n_flank_gtex_traits: 50

# ---- Per-stage seeds (stage1_seed/stage2_seed overridden per replicate) ----
stage1_seed: 11
stage2_seed: 11
stage3_seed: 1
stage4_seed: 1
stage5_seed: 1

# ---- Search dirs ----
# stage1_search_dirs is supplied per-replicate on the CLI (points at the x35
# A{N}/stage1 dir so stage 1 is reused, not rerun). Leave empty here.
stage1_search_dirs: []
stage2_search_dirs: []

# ---- Stage 3/4 specifics ----
ld_ctrl: 0.75
fastenloc_total_snps: auto
already_includes_neutral: True

# ---- Workdir / publish (per-replicate; override via --config) ----
workdir: /n/scratch/users/n/njc12/snakemake/simulations_round_2_2Mb_x1/human
publishdir: /n/data2/hms/dbmi/sunyaev/lab/nconnally/snakemake/simulations_round_2_2Mb_x1/human
