# Cattle baseline, 2 Mb region. Shared run that produces the epoch_8 checkpoint
# the 8 from-midpoint replicates continue from. The 2 Mb burn-in is EXTRACTED
# from the 10 Mb burn-in (helpers/extract_subregion.py) and placed in this
# workdir's stage1/ as farm_burn_in.Q_0.01.L_2000000.seed_20250303.cycle_25000.ts,
# so only the selection step runs. (In practice the selection is launched as a
# standalone sbatch -- this config documents the parameters and the stage1 dir
# that cattle_baseline_from_midpoint_2Mb points at.)

pipeline: cattle_baseline
species: cattle
basename: cattle_baseline
species_prefix: c

# ---- Selection / demography parameters ----
Q_scaling: 0.01
# Round-2 value: what the three farm_*.slim scripts hard-coded. NOTE that the
# msprime stage (farm_create_orig_pop_e2.py) ran at 1.3e-8 in these runs, so the
# deep genealogy and the forward phase disagreed -- that inconsistency is the
# reason this key exists. Round-3 configs use 1.3e-8 everywhere.
recombination_rate: 9.26e-9
L: 2000000

# ---- Sample sizes ----
gwas_scaling: 35
gtex_scaling: 35
min_maf: 0.01
# Pinned, not defaulted. causal_min_maf now defaults to 0 (no floor) and applies
# in both causal_sampling schemes; 0.01 is what this config's arm actually ran
# under, and it is also the one value that emits no path segment, so existing
# stage-2..5 outputs stay adoptable. See helpers/paths.py:LEGACY_CAUSAL_MIN_MAF.
causal_min_maf: 0.01
gwas_size: 8000
gtex_size: 1000

# ---- Per-stage seeds ----
stage1_seed: 20250303
stage2_seed: 20250303
stage3_seed: 1
stage4_seed: 1
stage5_seed: 1

# ---- Search dirs ----
cattle_baseline_search_dirs: []
stage1_search_dirs: []
stage2_search_dirs: []

# ---- Burn-in cycle to use as input to farm_selection.slim ----
burn_in_cycle: 25000

# ---- SLiM binary (SLiM 5.2 wrapper; reads pyslim file_version 0.9 .trees) ----
slim_binary: /home/njc12/bin/slim_5/slim_wrapper.sh

# ---- Stage 3/4 specifics ----
ld_ctrl: 0.75
dapg_window: 250000
fastenloc_total_snps: auto
already_includes_neutral: True

# ---- Workdir / publish (distinct 2 Mb root; never touches the 10 Mb run) ----
workdir: /n/scratch/users/n/njc12/snakemake/simulations_round_2_2Mb/cattle_baseline
publishdir: /n/data2/hms/dbmi/sunyaev/lab/nconnally/snakemake/simulations_round_2_2Mb/cattle_baseline
