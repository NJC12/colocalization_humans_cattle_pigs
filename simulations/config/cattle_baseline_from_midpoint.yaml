# Cattle baseline simulation continued from an epoch-8 checkpoint of a
# previously-completed cattle_baseline run. Runs epochs 8-12 only via
# farm_selection_from_ep8.slim -- baseline-equivalent output, much faster.

pipeline: cattle_baseline_from_midpoint
species: cattle
basename: cattle_baseline_from_midpoint
species_prefix: c

# ---- Demography parameters ----
Q_scaling: 0.01
# Round-2 value: what the three farm_*.slim scripts hard-coded. NOTE that the
# msprime stage (farm_create_orig_pop_e2.py) ran at 1.3e-8 in these runs, so the
# deep genealogy and the forward phase disagreed -- that inconsistency is the
# reason this key exists. Round-3 configs use 1.3e-8 everywhere.
recombination_rate: 9.26e-9
L: 10000000

# ---- Sample sizes ----
gwas_scaling: 35
gtex_scaling: 35
min_maf: 0.01
gwas_size: 8000
gtex_size: 1000

# ---- Per-stage seeds ----
# cattle_baseline_seed identifies the predecessor run whose epoch_8.ts we load
cattle_baseline_seed: 20250303
# stage1_seed is THIS continuation run's seed (must differ from baseline runs)
stage1_seed: 20260511
stage2_seed: 20260511
stage3_seed: 1
stage4_seed: 1
stage5_seed: 1

# ---- Trait selection cap (optional) ----
# Set all three to enable a category-wide cap on fine-mapped traits.
# Each replicate independently selects ceil(selection_cap / num_replicates)
# traits, seeded by (selection_seed, stage1_seed). Raising selection_cap on
# a later run extends the prefix without reshuffling, so already-completed
# DAP-G/fastEnloc jobs remain valid.
# selection_cap: 1500
# selection_seed: 42
# num_replicates: 4

# ---- Search dirs ----
# Round-2 (new DFE) starts from scratch; legacy dirs intentionally omitted to
# avoid silently reusing old-DFE .ts files. Populate with round-2 paths once a
# baseline run exists under simulations_round_2/ if you want to chain from a
# from-midpoint epoch_8 checkpoint.
cattle_baseline_search_dirs:
  - /n/scratch/users/n/njc12/snakemake/simulations_round_2/cattle_baseline/stage1
stage1_search_dirs: []
stage2_search_dirs: []

# ---- SLiM binary ----
# Same as cattle_baseline.yaml: use the SLiM 5.2 wrapper so file_version 0.9
# .trees files (written by pyslim 1.1.1) can be read.
slim_binary: /home/njc12/bin/slim_5/slim_wrapper.sh

# ---- Stage 3/4 specifics ----
ld_ctrl: 0.75
dapg_window: 250000
fastenloc_total_snps: auto
already_includes_neutral: True

# ---- Workdir / publish (distinct from cattle_baseline to avoid collisions) ----
workdir: /n/scratch/users/n/njc12/snakemake/simulations_round_2/cattle_baseline_from_midpoint
publishdir: /n/data2/hms/dbmi/sunyaev/lab/nconnally/snakemake/simulations_round_2/cattle_baseline_from_midpoint
